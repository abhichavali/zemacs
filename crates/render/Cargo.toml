[package]
name = "zemacs-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zemacs-core.workspace = true
zemacs-term.workspace = true
zemacs-gui.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
# Encoding only, for `Renderer::save_png`. Already the workspace's PNG codec —
# `zemacs-figure` and `zemacs-latex` decode with it — so this costs no new
# entry in `Cargo.lock` and no C toolchain. `image` would have cost both.
png = "0.18"

# `use-pkgconfig` is what finds Homebrew's SDL2 on Apple Silicon — /opt/homebrew/lib
# is not on the default linker search path, so without it the test binary fails to link.
sdl3 = { version = "0.18.4", features = ["ttf", "use-pkg-config"] }
