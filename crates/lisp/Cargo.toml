[package]
name = "zemacs-lisp"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
zemacs-core.workspace = true
zemacs-rpc.workspace = true
crossbeam-channel.workspace = true
# `org-latex-preview` is written in Lisp, so the image runs the pipeline itself:
# `zemacs-syntax` finds the fragments (its org module is downstream of core,
# which is why that one reader cannot live in `query.rs`) and `zemacs-latex`
# turns one into pixels. Both are already in the app's tree, so neither costs a
# new build.
zemacs-latex.workspace = true
zemacs-syntax.workspace = true
# ...and its sibling: `[[file:fig-1.svg]]` drawn as the figure rather than as
# the link text. Same shape as the LaTeX one — a path in, RGBA out — landing in
# the same `add_image` under the same kind of content-derived id, so there is
# one image cache and one eviction story rather than two.
zemacs-figure.workspace = true
# A scene is described in Lisp and laid out in Rust, so the tree crosses the
# boundary as printed source and something has to read it back. That reader is
# `scene.rs`, and it lives here rather than in `crates/gui` because that crate
# deliberately has no dependencies at all and no idea an image of Lisp exists.
zemacs-gui.workspace = true
# One reader: the projects visited before, which `project-switch' offers. A
# short persisted list rather than a tree walk, so it can cross the shim as a
# Lisp list and the picker over it is an ordinary `completing-read' in
# `runtime/plugins/project.lisp'. `docs/boundary.org' named this crate edge as
# the price of closing that split, and this is it.
zemacs-project.workspace = true
# Two more readers, both lists of names: the refs and the branches of the
# repository behind the live buffer, which are what `b b` and `b k` complete
# over. `runtime/modes/magit.lisp` priced this edge as the upgrade from a bare
# `read-string`; the list is a few dozen strings, so it crosses the shim as a
# Lisp list like `project-recent` does.
zemacs-git.workspace = true

[build-dependencies]
cc = "1"
