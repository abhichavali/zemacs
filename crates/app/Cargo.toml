[package]
name = "zemacs-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zemacs"
path = "src/main.rs"

[dependencies]
zemacs-core.workspace = true
zemacs-render.workspace = true
zemacs-syntax.workspace = true
zemacs-lisp.workspace = true
zemacs-git.workspace = true
zemacs-dired.workspace = true
zemacs-term.workspace = true
zemacs-project.workspace = true
# `/ssh:host:/path` in `find-file`, `:w` and dired. On the local path this is
# one `memcmp` against `/ssh:` and nothing else — see `tramp::parse`.
zemacs-tramp.workspace = true
# Layout and hit testing for a pane showing a scene. The event loop needs both
# — a wheel notch has to be clamped against the document's height, and a click
# has to come back as the tag under it — and neither is arithmetic core can do,
# because a scene is measured in pixels rather than counted in cells.
zemacs-gui.workspace = true
zemacs-rpc.workspace = true
# The `--control` protocol, both directions. Already in the tree for the same
# reason it is here: a parent process's requests are untrusted input, and a
# hand-rolled parser at a trust boundary desynchronises the stream on somebody
# else's machine.
serde_json.workspace = true
crossbeam-channel.workspace = true
# For `_exit` alone, at the very bottom of `main`. Already in the lockfile
# several times over; see the comment there for why the process cannot be left
# to end itself.
libc = "0.2"
anyhow.workspace = true
# `use-pkgconfig` is required on Apple Silicon: Homebrew's /opt/homebrew/lib is
# not on the default linker search path, so SDL2 is otherwise not found.
sdl3 = { version = "0.18.4", features = ["use-pkg-config"] }
